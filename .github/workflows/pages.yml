name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  # Try every 3 hours, off the hour (GitHub delays or skips scheduled runs, often for hours). A run
  # fetches a new snapshot only when the published one is over 5 hours old, so the chains still see
  # about one refresh every 6 hours.
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if a chain lists far fewer cinemas than before"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests
        run: python3 -m unittest discover -s tests -t .
      - name: JavaScript tests
        run: node --test "tests/js/*.test.mjs"

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Copy the site
        run: cp -r site _site
      - name: Showtimes snapshot (fetch when the published one is old; reuse it on a code push)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/snapshot.mjs --out _site/data/showtimes.json \
              --reuse https://edwardywy.github.io/52frames/data/showtimes.json \
              --guard https://edwardywy.github.io/52frames/data/showtimes.json
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/snapshot.mjs --out _site/data/showtimes.json \
              --reuse https://edwardywy.github.io/52frames/data/showtimes.json --reuse-hours 5 \
              --guard https://edwardywy.github.io/52frames/data/showtimes.json
          else
            node scripts/snapshot.mjs --out _site/data/showtimes.json \
              --guard https://edwardywy.github.io/52frames/data/showtimes.json \
              --force "${{ inputs.force }}"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
